{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 rounded-0 border border-2 border-dark shadow-none bg-white">
            <h4 class="fw-bold mb-3 border-bottom border-2 border-dark pb-2 text-uppercase">Formulario de Registro</h4>
            
            <form action="/requests/new" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase">Organización / Empresa:</label>
                    <input type="text" name="organizacion" class="form-control rounded-0 border-dark" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase">Correo de Contacto:</label>
                    <input type="email" name="contacto" class="form-control rounded-0 border-dark" required placeholder="ejemplo@gmail.com">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase">Descripción detallada:</label>
                    <textarea name="descripcion" class="form-control rounded-0 border-dark" rows="4" required></textarea>
                </div>

                <div class="d-flex gap-2 border-top border-dark pt-3">
                    <button type="submit" class="btn btn-dark rounded-0 fw-bold border border-dark">GUARDAR</button>
                    <a href="/dashboard" class="btn btn-outline-dark rounded-0 fw-bold">CANCELAR</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
