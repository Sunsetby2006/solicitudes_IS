<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitudes APP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    {% if user %}
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">Solicitudes APP</a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white-50 small">
                    👤 {{ user.email }} (<strong>{{ user.role }}</strong>)
                </span>
                <a href="/dashboard" class="btn btn-outline-light btn-sm">Inicio</a>
                
                <!-- REQUERIMIENTO 4: Ocultar botón Admin si es usuario normal -->
                {% if user.role == "ADMIN" %}
                <a href="/admin" class="btn btn-outline-warning btn-sm">Panel Admin</a>
                {% endif %}

                <a href="/logout" class="btn btn-outline-danger btn-sm">Salir</a>
            </div>
        </div>
    </nav>
    {% endif %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
