<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso al Sistema</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-secondary-subtle">
    <div class="card p-4 rounded-0 border border-2 border-dark shadow-none bg-white" style="width: 380px;">
        <div class="border-bottom border-2 border-dark pb-2 mb-3 text-center">
            <h5 class="fw-bold m-0 text-uppercase">[ AUTENTICACIÓN ]</h5>
        </div>

        {% if error %}
        <div class="alert alert-danger rounded-0 border border-danger py-2 small text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/auth/google" method="POST">
            <div class="mb-4">
                <label class="form-label small fw-bold text-uppercase">Correo Electrónico:</label>
                <input type="email" name="email" class="form-control rounded-0 border-dark" value="usuario@gmail.com" required>
                <div class="form-text small">
                    Debe existir como usuario activo en la base de datos.
                </div>
            </div>

            <button type="submit" class="btn btn-dark rounded-0 border border-dark w-100 py-2 fw-bold text-uppercase">
                INGRESAR AL SISTEMA
            </button>
        </form>
    </div>
</body>
</html>
