<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Autenticador OTP - Solicitudes APP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="card p-4 shadow" style="width: 350px;">
        <h4 class="text-center mb-3">Autenticador OTP</h4>
        <p class="text-muted text-center small">Ingresa el código de 6 dígitos de tu app autenticadora</p>
        <form action="/auth/mfa/verify" method="POST">
            <div class="mb-3">
                <input type="text" name="codigo_otp" class="form-control text-center fs-4" placeholder="000000" maxlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Verificar e Ingresar</button>
        </form>
    </div>
</body>
</html>
