<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Autenticador OTP - Solicitudes APP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-secondary-subtle">
    <div class="card p-4 rounded-0 border border-2 border-dark shadow-none bg-white" style="width: 380px;">
        <div class="border-bottom border-2 border-dark pb-2 mb-3 text-center">
            <h5 class="fw-bold m-0 text-uppercase">[ AUTENTICACIÓN OTP ]</h5>
        </div>
        <p class="text-center small mb-4">
            Ingresa el código de 6 dígitos de tu aplicación autenticadora.
            <a href="/auth/mfa/setup">Para obtener su código, da clic aquí</a>
        </p>

        {% if error %}
        <div class="alert alert-danger rounded-0 border border-danger py-2 small text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/auth/mfa/verify" method="POST">
            <input type="hidden" name="csrfToken" value="{{ csrf_token }}">
            <div class="mb-4">
                <label class="form-label small fw-bold text-uppercase">
                    Código de Verificación:
                </label>
                <input
                    type="text"
                    name="codigo_otp"
                    class="form-control rounded-0 border-dark text-center fs-4"
                    placeholder="000000"
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    required
                >
            </div>
            <button
                type="submit"
                class="btn btn-dark rounded-0 border border-dark w-100 py-2 fw-bold text-uppercase">
                VERIFICAR E INGRESAR
            </button>
        </form>
    </div>
</body>
</html>
