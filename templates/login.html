<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Solicitudes APP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="card p-4 shadow-lg border-0 rounded-4" style="width: 380px;">
        <h4 class="text-center fw-bold mb-1">Solicitudes APP</h4>
        <p class="text-muted text-center small mb-4">Simulador de Inicio de Sesión con Google</p>

        <form action="/auth/google" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Correo de Google:</label>
                <input type="email" name="email" class="form-control" value="usuario@gmail.com" required>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">Simular Rol de Usuario:</label>
                <select name="role" class="form-select">
                    <option value="USER">Usuario Normal</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>

            <button type="submit" class="btn btn-danger w-100 py-2 d-flex align-items-center justify-content-center gap-2 rounded-3">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1H12v2.8h5.35c-.25 1.4-1.1 2.6-2.35 3.4v2.8h3.8c2.2-2 3.55-5 3.55-9c0-.6-.05-1.2-.15-1.8z"/></svg>
                Iniciar Sesión con Google
            </button>
        </form>
    </div>
</body>
</html>
