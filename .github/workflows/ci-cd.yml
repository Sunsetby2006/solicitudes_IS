name: CI/CD - Solicitudes APP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ==========================================
  # 1) CODIGO — chequeo estático rápido
  # ==========================================
  codigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar flake8
        run: pip install flake8

      - name: Revisar errores reales de sintaxis/lógica
        run: |
          # Solo falla ante errores graves (sintaxis, nombres indefinidos, etc.)
          # No exige un estilo de formato particular.
          flake8 codigos/ tests/ --select=E9,F63,F7,F82 --show-source

  # ==========================================
  # 2) TEST — casos automatizados de la matriz de pruebas
  # ==========================================
  # Cubre TC-01, TC-02, TC-07 y TC-20 (ver matriz_pruebas_solicitudes.xlsx).
  # No necesita una Postgres real: usa app.dependency_overrides para
  # simular get_db, o ni siquiera llega a tocar la DB.
  test:
    needs: codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar pytest
        run: pip install pytest httpx

      - name: Ejecutar pruebas (TC-01, TC-02, TC-07, TC-20)
        env:
          # Valores falsos: solo para que create_engine arme la URL
          # sin tronar al importar main.py. No se abre conexión real.
          DB_USER: ci_dummy
          DB_PASSWORD: ci_dummy
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: ci_dummy
        run: pytest tests/ -v

  # ==========================================
  # 3) BUILD — validar que la app instala e importa limpio
  # ==========================================
  # Sin Docker: Render usa runtime Python nativo, así que esta etapa
  # valida lo que realmente importa para ese runtime — que las
  # dependencias instalen bien y que main.py no tenga errores de
  # import (sin necesitar una DB real: la conexión es diferida).
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar que la app importa sin errores
        env:
          # Valores falsos: solo para que create_engine pueda armar
          # la URL sin tronar. No se abre ninguna conexión real aquí.
          DB_USER: ci_dummy
          DB_PASSWORD: ci_dummy
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: ci_dummy
        run: |
          cd codigos
          python -c "import main; print('main.py importa correctamente')"

  # ==========================================
  # 4) DEPLOY — disparar el deploy en Render
  # ==========================================
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy hook de Render
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Falta configurar el secret RENDER_DEPLOY_HOOK_URL en el repo."
            exit 1
          fi
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
