{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm rounded-4 border-0">
            <h3 class="fw-bold mb-3">Crear Nueva Solicitud</h3>
            
            <!-- enctype multipart para permitir archivos -->
            <form action="/requests/new" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Nombre de la Organización</label>
                    <input type="text" name="organizacion" class="form-control" required placeholder="Ej. Mi Empresa S.A.">
                </div>

                <div class="mb-3">
                    <label class="form-label">Contacto (Gmail / Correo / Teléfono)</label>
                    <input type="email" name="contacto" class="form-control" required placeholder="correo@gmail.com">
                </div>

                <div class="mb-3">
                    <label class="form-label">Imagen / Foto de la Solicitud (Custom)</label>
                    <input type="file" name="imagen" class="form-control" accept="image/*" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción de lo que ocupas</label>
                    <textarea name="descripcion" class="form-control" rows="3" required placeholder="Detalla tu requerimiento..."></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">Guardar Solicitud</button>
                    <a href="/dashboard" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
